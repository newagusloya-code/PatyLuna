services:
  # ── Web Service (Docker Monolith: FastAPI + Vite) ───────────────────────────
  - type: web
    name: sleepwell-monolith
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sleepwell-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      # Secrets must be set manually in the Render Dashboard
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: AI_API_KEY
        sync: false

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  - type: pgo
    name: sleepwell-db
    plan: free
    postgresMajorVersion: 15
    databaseName: sleepwelldb
    user: sleepwelluser
