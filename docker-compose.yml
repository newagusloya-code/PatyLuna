version: '3.8'

services:
  app:
    build: .
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/sleepwell
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sleepwell
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "0.0.0.0:6379:6379"

volumes:
  postgres_data:
